name: Build Falling Pickaxe APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip wget openjdk-17-jdk autoconf automake autopoint libtool pkg-config cmake libffi-dev libssl-dev zlib1g-dev

      - name: Install Buildozer
        run: python3 -m pip install --upgrade pip buildozer cython

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: falling-pickaxe-apk
          path: bin/*.apk
